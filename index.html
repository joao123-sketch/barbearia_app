    <script>
      // Pinta o fundo com a cor usada da última vez, antes do app carregar (evita piscar)
      try {
        var c = localStorage.getItem("barber_last_bg");
        if (c) { document.body.style.backgroundColor = c; document.documentElement.style.backgroundColor = c; }
      } catch (e) {}
    </script>
